name: CANGREJO CI — Bun + Rust + moonrepo Polyglot DAG (Gates 0-11)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  moon-bun-dag:
    name: "🚀 Bun 1.4 + Rust + moon 2.6 Polyglot DAG (19 Tasks / Gates 0-11)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain (Cargo + cdylib for bun:ffi)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install Dependencies via Bun
        run: bun install --frozen-lockfile

      - name: Display 9-Project moon Polyglot Graph
        run: bun run moon:projects

      - name: Run 19-Task Polyglot DAG (Typecheck + Build + Gates 0-11) via moon
        run: bun run moon:check

  node-compat:
    name: "Node.js ${{ matrix.node-version }} Compatibility"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Build Production Bundle (Vite)
        run: npm run build
