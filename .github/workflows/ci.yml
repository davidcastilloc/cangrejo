name: CANGREJO CI — Lightweight PR Verification (Gates 0-11)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "public/**"
      - "LICENSE"
      - "CITATION.cff"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "public/**"
      - "LICENSE"
      - "CITATION.cff"
      - ".editorconfig"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  moon-bun-dag:
    name: "🚀 Bun 1.4 + Rust + moon 2.6 Polyglot DAG (Gates 0-11)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (Cargo + cdylib for bun:ffi)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/layout-rs -> target"

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install Dependencies via Bun
        run: bun install --frozen-lockfile

      - name: Run Polyglot Verification (Typecheck + Build + Gates 0-11) via moon
        run: bun run moon:check
