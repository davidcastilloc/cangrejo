name: CANGREJO CI — Bun + moonrepo DAG & Architectural Gates (0-3)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  moon-bun-dag:
    name: "🚀 Bun 1.4 + moon 2.6 DAG (13 Tasks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install Dependencies via Bun
        run: bun install --frozen-lockfile

      - name: Display moon Project Graph
        run: bun run moon:projects

      - name: Run 13-Task DAG (Typecheck + Gates 0-3) via moon + Bun
        run: bun run moon:check

  node-compat:
    name: "Node.js ${{ matrix.node-version }} Compatibility"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite (Gates 0-3)
        run: npm test
