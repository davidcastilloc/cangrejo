name: CANGREJO CI — Lightweight PR Verification (Gates 0-11)

# Cloudflare Workers Builds handles automatic build & deploy on pushes to `main`.
# GitHub Actions only runs lightweight typecheck + unit tests on Pull Requests (or manual dispatch).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "public/**"
      - "LICENSE"
      - "CITATION.cff"
      - ".editorconfig"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: "⚡ Bun Typecheck & Gates 0-11"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck & Run Gate Suites (0-11)
        run: bun run typecheck && bun test

